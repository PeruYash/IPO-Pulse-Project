name: Update IPO Pulse

on:
  schedule:
    # Every ~33 minutes
    #
    # Active time: 07:00 AM - 02:00 AM IST
    # No runs:     02:00 AM - 07:00 AM IST
    #
    # GitHub Actions cron uses UTC.
    # The schedule below follows a 33-minute sequence in UTC,
    # corresponding to the desired daytime/evening IST window.

    - cron: "30 1 * * *"
    - cron: "3,36 2 * * *"
    - cron: "9,42 3 * * *"
    - cron: "15,48 4 * * *"
    - cron: "21,54 5 * * *"
    - cron: "27 6 * * *"
    - cron: "0,33 7 * * *"
    - cron: "6,39 8 * * *"
    - cron: "12,45 9 * * *"
    - cron: "18,51 10 * * *"
    - cron: "24,57 11 * * *"
    - cron: "30 12 * * *"
    - cron: "3,36 13 * * *"
    - cron: "9,42 14 * * *"
    - cron: "15,48 15 * * *"
    - cron: "21,54 16 * * *"
    - cron: "27 17 * * *"
    - cron: "0,33 18 * * *"
    - cron: "6,39 19 * * *"
    - cron: "12 20 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ipo-pulse-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate IPO report
        run: python main.py

      - name: Commit updated report
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/index.html

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update IPO tracker $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./output"

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4