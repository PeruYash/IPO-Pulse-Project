name: Update IPO Pulse

on:
  schedule:
    # GitHub Actions cron is UTC.
    # 07:00 IST = 01:30 UTC
    - cron: "30 1 * * *"
    # 13:00 IST = 07:30 UTC
    - cron: "30 7 * * *"
    # 23:30 IST = 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ipo-pulse-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate IPO report
        run: python main.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/index.html

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Auto-update IPO tracker $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./output"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
